name: Android dev APK

# Manual fallback only: builds an arm64 APK with Gradle on a GitHub runner,
# signed with the debug key, kept as a workflow artifact. It is NOT the
# release path. Release APKs are built on EAS and published by
# android-release.yml on a v* tag (card C10); this runner shut down mid-build
# on PR #11, so it no longer runs on tags or pull requests. Use it only to
# debug a native build without spending an EAS build.

on:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: '1'
  # Must match DEFAULT_NDK_VERSION in @qvac/sdk/expo-plugin (0.22.0).
  QVAC_NDK_VERSION: '29.0.14206865'
  # The runner has 16 GB; R8 and the native merge steps need far more than
  # Gradle's 512 MiB default.
  GRADLE_JVMARGS: '-Xmx8g -XX:MaxMetaspaceSize=1g'

jobs:
  apk:
    name: Build dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK ${{ env.QVAC_NDK_VERSION }}
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${QVAC_NDK_VERSION}" > /dev/null

      - name: Install
        run: npm ci --no-audit --no-fund

      # Prebuild also bundles the QVAC worker and links its native addons.
      # --no-install: a reinstall after prebuild would unlink them.
      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      # The runner has 16 GB. Native debug symbols are off for release
      # (plugins/withNoNativeDebugSymbols.js); merging them ran out of heap.
      - name: Give Gradle more memory
        run: |
          # Project, user-home and command line (below) all get the same value:
          # the first try still ran with Gradle's 512 MiB default.
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          printf '\norg.gradle.jvmargs=%s\n' "$GRADLE_JVMARGS" >> android/gradle.properties
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          printf '\norg.gradle.jvmargs=%s\n' "$GRADLE_JVMARGS" >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
          grep -H jvmargs android/gradle.properties "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"

      - name: Build APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a \
            "-Dorg.gradle.jvmargs=$GRADLE_JVMARGS" 2>&1 | tee /tmp/gradle.log

      - name: Name the APK
        id: apk
        run: |
          name="soma-nami-dev-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: soma-nami-dev-apk
          path: mobile/${{ steps.apk.outputs.name }}
          retention-days: 14
          if-no-files-found: error
