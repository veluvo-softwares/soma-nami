name: Android dev APK

# Builds a standalone arm64 APK (JavaScript bundled in, signed with the debug
# key) that installs on a physical phone without a dev server. Not for the
# Play Store. The VPS can't build APKs, so this is the only Android build path
# besides a developer laptop.
#
# Runs on a version tag (v*), by hand, and on PRs that change native config.
# On a tag, the publish job also puts the APK in a GitHub Release in the
# public releases repo (card C10). The iOS build is EAS (C10), never a macOS
# runner here: macOS minutes on a private repo cost money.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'mobile/app.json'
      - 'mobile/qvac.config.json'
      - 'mobile/assets/fonts/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Only for the failure comment below.
  pull-requests: write

env:
  EXPO_NO_TELEMETRY: '1'
  # Must match DEFAULT_NDK_VERSION in @qvac/sdk/expo-plugin (0.22.0).
  QVAC_NDK_VERSION: '29.0.14206865'
  # The runner has 16 GB; R8 and the native merge steps need far more than
  # Gradle's 512 MiB default.
  GRADLE_JVMARGS: '-Xmx8g -XX:MaxMetaspaceSize=1g'

jobs:
  apk:
    name: Build dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK ${{ env.QVAC_NDK_VERSION }}
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${QVAC_NDK_VERSION}" > /dev/null

      - name: Install
        run: npm ci --no-audit --no-fund

      # Prebuild also bundles the QVAC worker and links its native addons.
      # --no-install: a reinstall after prebuild would unlink them.
      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      # The runner has 16 GB. Native debug symbols are off for release
      # (plugins/withNoNativeDebugSymbols.js); merging them ran out of heap.
      - name: Give Gradle more memory
        run: |
          # Project, user-home and command line (below) all get the same value:
          # the first try still ran with Gradle's 512 MiB default.
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          printf '\norg.gradle.jvmargs=%s\n' "$GRADLE_JVMARGS" >> android/gradle.properties
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          printf '\norg.gradle.jvmargs=%s\n' "$GRADLE_JVMARGS" >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
          grep -H jvmargs android/gradle.properties "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"

      - name: Build APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a \
            "-Dorg.gradle.jvmargs=$GRADLE_JVMARGS" 2>&1 | tee /tmp/gradle.log

      # The Bond VPS can't download Actions logs (the log host isn't on its
      # egress allowlist), so a failed PR build posts the Gradle error as a PR
      # comment, which it can read through the API.
      - name: Report Gradle failure on the PR
        if: failure() && github.event_name == 'pull_request'
        working-directory: /
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f /tmp/gradle.log ] || exit 0
          {
            echo "Android dev APK build failed at ${GITHUB_SHA::7} ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
            echo
            echo '```'
            grep -n -A25 'What went wrong' /tmp/gradle.log | head -60 || true
            echo '--- last 60 lines ---'
            tail -n 60 /tmp/gradle.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Name the APK
        id: apk
        run: |
          # Tag builds are named after the tag (soma-nami-v0.1.0.apk), others after the commit.
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="soma-nami-${GITHUB_REF_NAME}.apk"; else name="soma-nami-dev-${GITHUB_SHA::7}.apk"; fi
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: soma-nami-dev-apk
          path: mobile/${{ steps.apk.outputs.name }}
          retention-days: 14
          if-no-files-found: error

  # On a version tag, publish the APK as a GitHub Release in the public
  # releases repo (card C10). That repo holds only APKs and a README, never
  # source. RELEASES_TOKEN is a fine-grained token with Contents read & write
  # on that repo only; this repo's own GITHUB_TOKEN can't write there.
  publish:
    name: Publish APK to the releases repo
    needs: apk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASES_REPO: ${{ vars.RELEASES_REPO || 'veluvo-softwares/soma-nami-releases' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and history for the "what's new" list.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: soma-nami-dev-apk
          path: dist

      - name: Write release notes
        run: |
          # actions/checkout turns an annotated tag into a lightweight one;
          # fetch it again so its message can be the "what's new" text.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > notes.md
          cat notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASES_TOKEN is not set. Add it under Settings > Secrets and variables > Actions (card C10). The APK is still in this run's artifacts."
            exit 1
          fi
          apk="dist/soma-nami-${TAG}.apk"
          ls -lh "$apk"
          # Tags with a suffix (v0.2.0-rc1) are marked as pre-releases.
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          if gh release view "$TAG" -R "$RELEASES_REPO" > /dev/null 2>&1; then
            # Re-run of the same tag: replace the APK and the notes.
            gh release upload "$TAG" "$apk" -R "$RELEASES_REPO" --clobber
            gh release edit "$TAG" -R "$RELEASES_REPO" --notes-file notes.md
          else
            gh release create "$TAG" "$apk" -R "$RELEASES_REPO" \
              --title "Soma Nami ${TAG}" --notes-file notes.md "${pre[@]}"
          fi
          echo "https://github.com/${RELEASES_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
